<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13">
  <rect width="960" height="380" fill="#0d1117"/>
  <text x="20" y="30" fill="#e6edf3" font-weight="bold">One screen</text>
  <rect x="20" y="44" width="920" height="316" rx="8" fill="#161b22" stroke="#30363d"/>
  <rect x="32" y="56" width="230" height="292" rx="6" fill="#1f2630" stroke="#58a6ff"/>
  <text x="44" y="78" fill="#58a6ff" font-weight="bold">Left blade</text>
  <text x="44" y="96" fill="#8b949e" font-size="12">docked layer surface</text>
  <rect x="44" y="108" width="206" height="128" rx="4" fill="#0d1117" stroke="#3d444d"/>
  <text x="54" y="128" fill="#8b949e" font-size="12">slot 0</text>
  <rect x="54" y="138" width="64" height="18" rx="3" fill="#30363d"/>
  <text x="61" y="151" fill="#e6edf3" font-size="11">FILES</text>
  <rect x="124" y="138" width="64" height="18" rx="3" fill="#1f2630" stroke="#3d444d"/>
  <text x="131" y="151" fill="#8b949e" font-size="11">tab 2</text>
  <text x="54" y="182" fill="#8b949e" font-size="11">tabs share one slot;</text>
  <text x="54" y="200" fill="#8b949e" font-size="11">each tab keeps own state</text>
  <line x1="44" y1="246" x2="250" y2="246" stroke="#58a6ff" stroke-width="3"/>
  <text x="54" y="266" fill="#8b949e" font-size="11">drag the divider to resize</text>
  <rect x="44" y="276" width="206" height="62" rx="4" fill="#0d1117" stroke="#3d444d"/>
  <text x="54" y="296" fill="#8b949e" font-size="12">slot 1</text>
  <text x="54" y="318" fill="#e6edf3" font-size="11">PROPERTIES</text>
  <rect x="274" y="56" width="412" height="292" rx="6" fill="#0d1117" stroke="#3d444d" stroke-dasharray="4 3"/>
  <text x="288" y="78" fill="#8b949e" font-size="12">tiled Hyprland windows</text>
  <text x="288" y="98" fill="#8b949e" font-size="12">they shift over while a blade is docked</text>
  <rect x="698" y="56" width="230" height="292" rx="6" fill="#1f2630" stroke="#d29922"/>
  <text x="710" y="78" fill="#d29922" font-weight="bold">Right blade</text>
  <text x="710" y="96" fill="#8b949e" font-size="12">undocked: a normal window</text>
  <rect x="710" y="108" width="206" height="66" rx="4" fill="#0d1117" stroke="#3d444d"/>
  <text x="720" y="128" fill="#8b949e" font-size="12">slot 0</text>
  <text x="720" y="152" fill="#e6edf3" font-size="11">NOTES</text>
  <rect x="710" y="184" width="206" height="66" rx="4" fill="#0d1117" stroke="#3d444d"/>
  <text x="720" y="204" fill="#8b949e" font-size="12">slot 1</text>
  <text x="720" y="228" fill="#e6edf3" font-size="11">SKILLS (built in)</text>
  <rect x="710" y="260" width="206" height="66" rx="4" fill="#0d1117" stroke="#3d444d"/>
  <text x="720" y="280" fill="#8b949e" font-size="12">slot 2</text>
  <text x="720" y="304" fill="#e6edf3" font-size="11">CLOCK (extension)</text>
</svg>
